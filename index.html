<!-- ============ HOME (concept, cuisine-agnostic) ============ -->
<template id="view-home">
  <section class="section hero sec-hero">
    <div class="wrap">
      <p class="eyebrow">Plate Discipline</p>
      <h1>Skip the line.<br>Find the sleeper.</h1>
      <p class="kick">Over- and underrated restaurants, measured — one cuisine at a time.</p>
      <div class="flavornav" id="home-pick-top" style="margin-top:26px"></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <p class="eyebrow">The idea</p>
      <h2>The OBP of pizza</h2>
      <div class="idea-grid">
        <div class="idea-copy">
          <p class="lead">The primary insight in Moneyball was to judge hitters on on-base percentage. In 2000, OBP was the metric to exploit because it had four qualities at once: a <b>mechanism</b> (plate discipline), it <b>persisted</b> season to season, it <b>mapped to runs</b>, and the market still had it <b>mispriced</b>.</p>
          <p>The question for a slice is the same. Not <em>was it good once</em>, but <em>what about this shop is likely to be true again?</em> The signal first showed up in One&nbsp;Bite — across <b>57,498</b> dated slices, a shop's rating holds year to year at a corrected slope near <b>0.63</b>, a real signal, not a lottery ball. The cross-cuisine version now trains on <b>over a million dated Yelp reviews</b> and scores each NYC spot on its <b>live Google rating</b>. So the OBP isn't the highest rating; it's the <b>quality that reputation hasn't fully priced in</b> — and it runs on any cuisine.</p>
          <p class="pull">What forward-predicts a great slice is <b>craft, not the complaint</b> — coal-fired char, classic slice-work, real sauce. Even "real New York grease" bounces back rather than declining, so the model won't bet against it.</p>
        </div>
        <aside class="idea-card">
          <div class="card-h">Two signals, one gap</div>
          <p class="card-sub">Every venue carries both. We trade on the difference.</p>
          <ul class="coef">
            <li><span class="ar dn">▼</span> the famous signal — stars, volume, hype <b class="dn">priced in</b></li>
            <li><span class="ar up">▲</span> the truer signal — what the text &amp; trajectory predict <b class="up">mispriced</b></li>
          </ul>
          <p class="card-foot">Buy the second when the market is only paying for the first.</p>
        </aside>
      </div>
      <div class="callout" style="margin-top:24px"><h3>The Jason Giambis</h3>
        <p class="small" style="color:var(--ink2);margin:0">Ceres, L'Industrie and the other line-out-the-door darlings are the obvious stars — elite by reputation <em>and</em> by the evidence (baseball fans: the 2000 MVP <b>Jason Giambi</b>, a lock on both the eye test and the stat sheet). Nobody needs a model for those. The map is for the hundreds of spots where the rating doesn't tell the whole story.</p></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <p class="eyebrow">Where this comes from</p>
      <h2>Two inspirations</h2>
      <div class="insp-grid">
        <div class="insp">
          <div class="k">Moneyball</div>
          <h3>Buy value the market misprices</h3>
          <div class="credit">Michael Lewis, 2003</div>
          <p>Billy Beane ran the Oakland A's on one of baseball's smallest budgets and won by <b>buying value the market had mispriced</b> — paying for on-base percentage while everyone else drafted on the loud, expensive stats. The edge wasn't a secret formula; it was a truth in plain sight, ignored because the market kept staring at the wrong number.</p>
          <p>The numbers we eat by work the same way. A star rating, a line down the block, a viral clip are RBIs and batting average: loud, endlessly consumed, easy to mistake for the truth. The signal buried in the reviews is the OBP — quieter, more predictive, mispriced.</p>
        </div>
        <div class="insp">
          <div class="k">Prospect Theory</div>
          <h3>Delight = beating your reference point</h3>
          <div class="credit">Kahneman &amp; Tversky, 1979</div>
          <p>People don't judge outcomes in absolute terms. We measure them against a <b>reference point</b> — what we expected — and react to the <em>difference</em>, asymmetrically: a loss looms larger than the equivalent gain. A great meal you were promised is mere confirmation; one you didn't see coming is a real gain. A hyped letdown is a real loss — and it stings more.</p>
          <p>So a venue's rating isn't only a quality estimate — it's the <b>expectation you walk in with</b>. Great is the floor. The best experiences are great <em>and</em> better than you thought.</p>
        </div>
      </div>
      <p class="insp-tie">Put them together and that's the whole tool. The rating sets your expectation; the reviews tell us where you'll be <b>surprised</b> — quality the number hasn't priced in — and steer you clear of the letdowns dressed up as sure things. We're hunting delight.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <p class="eyebrow">Start here</p>

<!-- ============ METHODOLOGY (cuisine-agnostic) ============ -->
<template id="view-methodology">
  <section class="section">
    <div class="wrap method">
      <p class="eyebrow">Methodology</p>
      <h2>How the numbers are built</h2>
      <p class="lead" style="max-width:70ch">Cuisine-agnostic by design: the same forward model, refit and reapplied one cuisine at a time.</p>
      <dl>
        <dt>Predictability &amp; persistence</dt>
        <dd>A rating is only worth forecasting if it measures something durable — and it does. Year over year a venue's community rating persists at an <b>attenuation-corrected AR(1) slope of ~0.6–0.85</b> across cuisines: a real trait, not noise. So "what will this place be rated next year" is a well-posed question. We fit a <b>leakage-safe forward model</b> — next year's rating from this year's rating, its one-year momentum, and a dozen interpretable review-text features — and keep only what forward-predicts.</dd>
        <dt>How the data's gathered<br><span class="small" style="font-weight:400;text-transform:none;letter-spacing:0">estimate broad, apply narrow</span></dt>
        <dd>Fit the model on the widest corpus available, then apply the durable coefficients to a new city. Here: fit on the <b>Yelp Open Dataset</b> (~7M dated, full-text reviews across 11 metros; Philadelphia is the largest), then score NYC by pulling each venue's current rating and recent reviews.</dd>
        <dt>Coverage<br><span class="small" style="font-weight:400;text-transform:none;letter-spacing:0">a census, not a sample</span></dt>
        <dd>The venue universe — the population every cuisine is scored against — is the <b>NYC DOHMH restaurant-inspection census</b>: every permitted restaurant tagged to the cuisine, deduped to one shop per row. So the board isn't a curated shortlist; the left-hand list is <b>near-complete coverage</b> of what's actually operating. Google Places then supplies each venue's current rating and recent review text, and editorial lists supply the attention axis.</dd>
        <dt>Data sources</dt>
        <dd><b>Yelp Open Dataset</b> (model fit) · <b>Google Places</b> (NYC current rating + reviews) · <b>NYC DOHMH inspections</b> (coverage / liveness) · editorial best-of lists — <b>Eater, Infatuation, Grub Street</b> (the attention axis).</dd>
      </dl>
      <div class="note">
        <b>A demo, not a verdict.</b> Thin samples are shrunk toward the mean; chains are excluded from the recommendation math; and the forward signal is a small tilt on the rating <em>by design</em>. Read it as reputation-versus-evidence, not a final ranking.
      </div>
    </div>
  </section>
  <section class="section">
    <div class="wrap">
      <p class="eyebrow">By genre</p>
      <h2>What each cuisine's model learns</h2>
      <p class="lead" style="max-width:76ch">The model is refit per cuisine because the same words mean opposite things. The sharpest example: <b>"greasy / rich" is praise for Mexican</b> — indulgent carnitas and al pastor — but <b>decay for Thai and pizza</b>. A feature only feeds a recommendation when its fitted sign matches a defensible quality mechanism; that filter is what lets the model <em>reject</em> words that merely ride a mean-reversion bounce.</p>
      <div class="genre-grid">
        <div class="insp">
          <div class="k">🍕 Pizza</div>
          <h3>Grease is a low walk rate</h3>
          <p>Ratings persist at a corrected AR(1) ≈ <b>0.63</b>. <b>Grease forward-predicts decline</b> — structural, sticky, and forever excused as "real New York grease" — so it drives the skip list. Specific, detailed reviews point to gains; a one-year rating spike tends to give itself back.</p>
          <span class="credit">Being refit on Yelp (training) + Google (NYC scoring); currently shown on One Bite data.</span>
        </div>
        <div class="insp">
          <div class="k">🌮 Mexican</div>
          <h3>"Greasy / rich" is praise</h3>
          <p>The stickiest genre — AR(1) ≈ <b>0.76</b>. Indulgence reads as carnitas / al-pastor praise, not decay, the opposite of pizza. Specialization (al pastor, birria, barbacoa), regional authenticity, and an ambitious salsa program forecast a rising spot. The overrated trap is chains — Chipotle, Taco Bell, Qdoba: enormous volume, low modeled quality.</p>
        </div>
        <div class="insp">
          <div class="k">🍜 Thai</div>
          <h3>Funk and wok hei, not sugar</h3>
          <p>AR(1) ≈ <b>0.66</b>. Regional authenticity (Isan, khao soi, som tum), fish-sauce funk, and wok execution (pad see ew, drunken noodle, wok hei) forecast rising; oily / soggy decay forecasts decline. Tell-tale: the model <b>rejects "too sweet / americanized"</b> — it loads positive year to year as a mean-reversion bounce, not quality.</p>
          <span class="credit">Caveats: DOHMH cuisine tags occasionally misfile (Din Tai Fung, Taiwanese, rides along); Google matched ~35% of the DOHMH Thai universe.</span>
        </div>
      </div>
    </div>
  </section>

function cuInfo(){ return state.cuisine==="mexican"?CU_MEXICAN:state.cuisine==="thai"?CU_THAI:CU_PIZZA; }

  WORTH_W= state.cuisine==="mexican"?3.29:state.cuisine==="thai"?4.87:5.03;
  // rating-scale constants (x-axis max, "well-reviewed" floor, "looks good" cut). One Bite pizza is
  // a genuine 6-10; Google-scored cuisines flip to native 1-5 here at the redo. Defaults = no change.
  SCALE = {xmax:5,floor:1,good:2.5};
  WORTH_CUT = worthCut();
  CU = cuInfo();

/* ---------- worth math ---------- */
function worthOf(r){ return r.current_rating + WORTH_W*r.nudge; }
function allEligible(){ return DATA.filter(r=>r.rating_eligible && r.current_rating>=SCALE.floor); }
function worthCut(){
  const a=allEligible().map(worthOf).sort((x,y)=>y-x);
  return a.length? a[Math.min(a.length-1, Math.floor(a.length*REC_FRAC))] : 8;
}
function xMin(){   // per-cuisine, data-driven left edge: ~3rd pctile of current rating over the plotted set, floored to .5
  const cr=allEligible().map(r=>r.current_rating).sort((a,b)=>a-b);
  if(!cr.length) return 6;
  const p=cr[Math.floor((cr.length-1)*0.03)];
  return Math.floor(p*2)/2;
}

/* ---------- FLAVOR: WHERE TO GO ---------- */
function goskipMarkup(){
  return `
  <p class="eyebrow">The mispricing map</p>
  <h2>Rated well — and the reviews agree</h2>
  <p class="tagline">Current rating on the <b>x-axis</b> (higher = more loved); the <b>review signal</b> on the y. The dashed diagonal is the <b>worth-it bar</b> — the top quarter by <b>adjusted score</b> (the rating plus its review signal). Points clear it (<b style="color:${GO}">green</b>), fall short despite a positive review signal (<b style="color:${YEL}">yellow</b>), or carry a negative one (<b style="color:${SKIP}">red</b>); the five <b style="color:${STAR}">blue stars</b> are the best bets overall. The signal is scaled so a typical swing in review signal counts about as much as a typical swing in rating — which is why a strong review can lift a modest rating onto the list and a bad one can drop a high one.</p>
  <div class="controls">${boroSelect()}</div>
  <div class="grid2">
    <div class="panel">
      <div class="chartbox"><canvas id="chart"></canvas></div>
      <div class="legend">
        <span style="color:${STAR};font-weight:700">★ Top 5 best bets</span>
        <span><i style="background:${GO}"></i>Worth it (above the bar)</span>
        <span><i style="background:${YEL}"></i>Positive review signal, under the bar</span>
        <span><i style="background:${SKIP}"></i>Negative review signal</span>
        <span>– – –&nbsp; worth-it bar (top quarter)</span>
      </div>
    </div>
    <div>
      <ul class="readbox">
        <li><b style="color:${STAR}">Blue stars</b> are the five best bets overall — the go-to list.</li>
        <li><b style="color:${GO}">Green</b> clears the worth-it bar. <b style="color:${YEL}">Yellow</b> carries a positive <em>review signal</em> — the text points to a rising score — but the rating's too modest to clear the bar (the overlooked). <b style="color:${SKIP}">Red</b>'s reviews point the other way.</li>
        <li><b style="color:${SKIP}">Lower-right</b> = the traps: rated high but the reviews (grease, price, a fading spike) sink it under the bar.</li>
      </ul>
    </div>
  </div>
  <div class="boards three">
    <div class="board panel"><h3><span style="color:${QC.consensus.c}">★</span> Best bets</h3>
      <div class="sub">Strongest combined evidence — rating and review signal</div>
      <table><thead><tr><th>#</th><th>Shop</th><th class="num">Rate</th><th class="num">Adj</th></tr></thead>
      <tbody id="best-body"></tbody></table></div>
    <div class="board panel"><h3><span style="color:${QC.underrated.c}">▲</span> Most underrated</h3>
      <div class="sub">Overlooked — reviews vouch beyond the number</div>
      <table><thead><tr><th>#</th><th>Shop</th><th class="num">Rate</th><th class="num">Signal</th></tr></thead>
      <tbody id="under-body"></tbody></table></div>
    <div class="board panel"><h3><span style="color:${QC.overrated.c}">▼</span> Looks good, but pass</h3>
      <div class="sub">Hype tax — rated 7.5+, but the reviews warn</div>
      <table><thead><tr><th>#</th><th>Shop</th><th class="num">Rate</th><th class="num">Adj</th></tr></thead>
      <tbody id="pass-body"></tbody></table></div>
  </div>`;
}
function goskipRows(){
  return DATA.filter(r=>r.rating_eligible && r.current_rating>=SCALE.floor && (state.borough==="all"||r.borough===state.borough));
}
function reasonFor(r){
  if(r.nudge<=-0.05){
    if(r.grease_rate>=0.34) return "grease showing";
    if(r.score_delta>=0.8) return "recent spike — fading";
    if(r.nudge<=-0.2) return "price / soft reviews";
    return "reviews run cool";
  }
  if(r.nudge>=0.05){
    if(r.specificity>=4.1) return "specific, detailed praise";
    if(r.score_delta<=-0.6) return "quietly climbing";
    return "reviews vouch for it";
  }
  return "reviews neutral";
}
const worthLine={id:"worthLine",beforeDatasetsDraw(c){const{ctx,chartArea:a,scales:s}=c;if(!a)return;
  ctx.save();
  const FONT=getComputedStyle(document.body).fontFamily;
  const py0=s.y.getPixelForValue(0);
  ctx.strokeStyle="rgba(80,60,45,.22)";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(a.left,py0);ctx.lineTo(a.right,py0);ctx.stroke();
  const yAt=x=>(WORTH_CUT-x)/WORTH_W;
  const pL=s.y.getPixelForValue(yAt(s.x.min)), pR=s.y.getPixelForValue(yAt(s.x.max));
  ctx.strokeStyle="rgba(46,158,91,.9)";ctx.lineWidth=1.7;ctx.setLineDash([7,4]);
  ctx.beginPath();ctx.moveTo(a.left,pL);ctx.lineTo(a.right,pR);ctx.stroke();ctx.setLineDash([]);
  ctx.font="700 12px "+FONT;
  ctx.fillStyle="rgba(46,158,91,.9)";ctx.textAlign="right";ctx.fillText("WORTH IT ▲",a.right-10,a.top+18);
  ctx.restore();}};
function drawGoSkip(){
  const MOB=window.innerWidth<=720;
  const rows=goskipRows(), ctx=document.getElementById("chart"); if(!ctx)return;
  const top5=new Set(rows.slice().sort((a,b)=>worthOf(b)-worthOf(a)).slice(0,5).map(r=>r.name));
  const jit=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (((h>>>0)%1000)/1000-0.5)*0.07;};
  const pts=rows.map(r=>({x:r.current_rating+jit(r.name),y:r.nudge,d:r,top:top5.has(r.name)}));
  const ns=rows.map(r=>r.nudge);
  const XMIN=xMin(), XMAX=SCALE.xmax;                             // per-cuisine data-driven x-min; x-max from SCALE
  const dLo=(WORTH_CUT-XMAX)/WORTH_W, dHi=(WORTH_CUT-XMIN)/WORTH_W;   // worth-it line endpoints at the live axis edges
  const ymax=Math.max(Math.max(...ns), dHi)+0.05, ymin=Math.min(Math.min(...ns), dLo)-0.05;
  const col=r=> worthOf(r)>=WORTH_CUT?GO : (r.nudge>=0?YEL:SKIP);
  if(chart)chart.destroy();
  chart=new Chart(ctx,{type:"scatter",
    data:{datasets:[{data:pts,parsing:false,
      backgroundColor:pts.map(p=>p.top?STAR:col(p.d)+"cc"),
      borderColor:pts.map(p=>p.top?"#1b4a94":"#fff"),borderWidth:pts.map(p=>p.top?1:.5),
      pointStyle:pts.map(p=>p.top?"star":"circle"),
      pointRadius:pts.map(p=>p.top?11:5),pointHoverRadius:pts.map(p=>p.top?13:8)}]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:6},
      scales:{x:{min:XMIN,max:XMAX,title:{display:true,text:MOB?"Current rating →":"Current rating  ▶ more loved",font:{size:12,weight:"600"}},grid:{color:"#f0e7d8"}},
              y:{min:ymin,max:ymax,title:{display:true,text:MOB?"← skip · signal · go →":"◀ predicts a dip      FORWARD SIGNAL (what reviews predict)      predicts a lift ▶",font:{size:11,weight:"600"}},grid:{color:"#f0e7d8"}}},
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>{const d=c.raw.d;const s=d.nudge>=0?"+":"";const w=worthOf(d);
          return [`${c.raw.top?"★ ":""}${d.name} — ${d.borough}`,
                  `Rated ${d.current_rating.toFixed(1)} · signal ${s}${d.nudge.toFixed(2)} · adj ${w.toFixed(1)} ${w>=WORTH_CUT?"— worth it":""}`,
                  `${reasonFor(d)} · ${d.n_rev} reviews`];}}}}},
    plugins:[worthLine]});
}
function gsRow(r,i,metric){
  const m = metric==="signal"
    ? {cls:r.nudge>=0?"pos":"neg", txt:(r.nudge>=0?"+":"")+r.nudge.toFixed(2)}
    : {cls:"", txt:worthOf(r).toFixed(1)};
  return `<tr><td class="rank">${i+1}</td>
    <td class="shop"><b>${r.name}</b><small>${r.borough} · <span class="reason">${reasonFor(r)}</span></small></td>
    <td class="num" data-label="Rate">${r.current_rating.toFixed(1)}</td>
    <td class="num metric ${m.cls}" data-label="${metric==="signal"?"Signal":"Adj"}">${m.txt}</td></tr>`;
}
function renderGoSkipBoards(){
  const r=goskipRows();
  const best=r.slice().sort((a,b)=>worthOf(b)-worthOf(a)).slice(0,12);
  const under=r.slice().sort((a,b)=>b.nudge-a.nudge).slice(0,12);
  const pass=r.filter(x=>x.current_rating>=SCALE.good && worthOf(x)<WORTH_CUT).sort((a,b)=>worthOf(a)-worthOf(b)).slice(0,12);
  document.getElementById("best-body").innerHTML=best.map((x,i)=>gsRow(x,i,"adj")).join("")||empty();
  document.getElementById("under-body").innerHTML=under.map((x,i)=>gsRow(x,i,"signal")).join("")||empty();
  document.getElementById("pass-body").innerHTML=pass.map((x,i)=>gsRow(x,i,"adj")).join("")||empty();
}

const quadBG={id:"quadBG",beforeDatasetsDraw(c){const{ctx,chartArea:a,scales}=c;if(!a)return;

}
function dedupe(list){const seen=new Set(),out=[];for(const r of list){if(seen.has(r.name))continue;seen.add(r.name);out.push(r);}return out;}
function gemRow(r,i){const q=r.quadrant;

function renderGemsBoards(){
