<!-- ============ PIZZA VIEW ============ -->
<template id="view-pizza">
  <section class="section hero">
    <div class="wrap">
      <p class="eyebrow">Pizzaball · New York City</p>
      <h1>Skip the line.<br>Find the sleeper.</h1>
      <p class="kick">Over- and underrated New York pizza, measured.</p>
      <p class="lead">If you're visiting and want to queue for <b>Ceres</b>, <b>Di Fara</b>, <b>L'Industrie</b> or <b>Lucali</b>, do it — those are the 2000 Jason Giambis: elite by reputation <em>and</em> by the underlying numbers. This is for the rest of us who live here — the neighborhood spots where the star rating doesn't tell the whole story, and the reviews fill in the rest.</p>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <p class="eyebrow">The idea</p>
      <h2>The OBP of pizza</h2>
      <div class="idea-grid">
        <div class="idea-copy">
          <p class="lead">The primary insight in Moneyball was to judge hitters on on-base percentage. In 2000, OBP was the metric to exploit because it had four qualities at once: a <b>mechanism</b> (plate discipline), it <b>persisted</b> season to season, it <b>mapped to runs</b>, and the market still had it <b>mispriced</b>.</p>
          <p>The question for a slice is the same shape — not <em>was it good once</em>, but <em>what about this shop is likely to be true again.</em> Across <b>57,498</b> One&nbsp;Bite reviews (2018–2026), shop ratings persist year to year at a corrected slope near <b>0.63</b> — a real signal, not a lottery ball.</p>
          <p>So the current rating is a strong starting guess. A shop rated 10.0 off three reviews probably isn't a 10, so the guess is <b>regressed toward the mean</b> by sample size. Then a handful of durable review signals tilt it up or down.</p>
          <p class="pull">Grease is a low walk rate — structural, sticky, and forever excused as "real New York grease." The skip list is mostly the inflated-and-greasy list.</p>
        </div>
        <aside class="idea-card">
          <div class="card-h">The forward model</div>
          <p class="card-sub">What predicts <em>next</em> year's score, once the current rating is held fixed:</p>
          <ul class="coef">
            <li><span class="ar up">▲</span> specific, detailed reviews <b class="up">+.08</b></li>
            <li><span class="ar dn">▼</span> grease <b class="dn">−.04</b></li>
            <li><span class="ar dn">▼</span> price gripes <b class="dn">−.05</b></li>
            <li><span class="ar dn">▼</span> a one-year rating spike <b class="dn">−.16</b></li>
          </ul>
          <p class="card-foot">The lagged score already sets the base (β ≈ 0.42, t = 33). The score leads; the reviews only tilt.</p>
        </aside>
      </div>
    </div>
  </section>


  <section class="section">
    <div class="wrap">
      <div class="flavornav" id="flavornav"></div>
      <div id="flavor-mount"></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <p class="eyebrow">Why it works</p>
      <h2>Which signals actually repeat</h2>
      <div class="idea-grid" style="grid-template-columns:1.15fr .85fr;align-items:center">
        <div class="panel">
          <div class="chartbox sm"><canvas id="persist"></canvas></div>
        </div>
        <div class="idea-copy">
          <p class="lead">A trait that repeats is measuring the shop; one that doesn't is measuring the day.</p>
          <p>Star score is the most persistent signal — which is why the current rating is a good starting guess. <b>Grease</b> repeating is bad: it forward-predicts decline, so it drives the skip list. Specific craft praise forward-predicts gains. <b>Service</b> complaints are noise — true today, gone by next year.</p>
          <p class="small" style="color:var(--muted);margin:0">Attenuation-corrected year-over-year AR(1) slope.</p>
        </div>
      </div>
    </div>
  </section>


</template>

<template id="view-inspiration">
  <section class="section">
    <div class="wrap">
      <p class="eyebrow">Where this comes from</p>
      <h2>Two inspirations</h2>
      <div class="insp-grid">
        <div class="insp">
          <h3>Moneyball</h3>
          <div class="credit">Michael Lewis, 2003 · <em>The Art of Winning an Unfair Game</em></div>
          <p>Billy Beane ran the Oakland A's on one of baseball's smallest budgets — an unfair game, rigged by money. His edge was <b>sabermetrics</b>: use the data to buy the wins the rich teams overlooked, paying for on-base percentage while everyone else drafted on the loud, expensive stats. The advantage wasn't a secret formula; it was a truth in plain sight, mispriced because the market kept staring at the wrong number.</p>
          <p>The numbers we eat by work the same way. A star rating, a line down the block, a cheese-pull photo are RBIs and batting average: loud, endlessly consumed, easy to mistake for the truth. The signal buried in the reviews is the OBP — quieter, more predictive, and mispriced.</p>
        </div>
        <div class="insp">
          <h3>Prospect Theory</h3>
          <div class="credit">Kahneman &amp; Tversky, 1979</div>
          <p>People don't judge outcomes in absolute terms. We measure them against a <b>reference point</b> — what we expected — and react to the <em>difference</em>, asymmetrically: a loss looms larger than the equivalent gain. A great slice you were promised is mere confirmation; one you didn't see coming is a real gain. A hyped letdown is a real loss — and it stings more.</p>
          <p>So a shop's rating isn't only a quality estimate — it's the <b>expectation you walk in with</b>. Great is the floor. The best experiences are great <em>and</em> better than you thought.</p>
          <p class="credit" style="margin:12px 0 0">Reference dependence · loss aversion · diminishing sensitivity · probability weighting · framing.</p>
        </div>
      </div>
      <p class="insp-tie">Put them together and that's the whole tool. The rating sets your expectation; the reviews tell us where you'll be <b>surprised</b> — quality the number hasn't priced in — and steer you clear of the letdowns dressed up as sure things. We're hunting delight.</p>
    </div>
  </section>
</template>

<template id="view-methodology">
  <section class="section">
    <div class="wrap method">
      <p class="eyebrow">Methodology</p>
      <h2>How the numbers are built</h2>
      <dl>
        <dt>Where to Go — current rating &amp; the worth-it line</dt>
        <dd>A leakage-safe forward model predicts next year's score from this year's: <b>score_t+1 ~ lagged score + one-year momentum + a dozen review-text features</b> (specificity, grease, price/"value" gripes, crust, sentiment, …). The lagged score dominates (β≈0.42), so it's <b>fixed on the x-axis</b> (6–10). The y-axis is the <b>review signal</b> — everything the model leverages beyond the number, reliability-weighted, with the mean-reversion trend removed (its correlation with the rating drops from −0.86 to −0.26). The recommendation is the <b>adjusted score = rating + 6.4 × signal</b>, top quarter recommended. The 6.4 is not arbitrary: it's the ratio of the rating's spread to the signal's spread, so one standard deviation of review signal counts the same as one of rating — reviews and number weigh equally, which is why a strong review can pull a 6.6 onto the list and a bad one can drop an 8. The crosshair (rating 8, zero signal) is just orientation. (Empirical-Bayes shrinkage, reliability = n/(n+1.4), still lives inside the signal, so a 10.0-off-three-reviews isn't taken at face value.)</dd>
        <dt>Hidden Gems — attention vs quality</dt>
        <dd>Quality = a reviewer- and expectation-adjusted venue fixed effect (the same reviewer scoring a famous shop colder is removed) blended with a shrunk Yelp snapshot. Attention = Yelp volume + editorial-list inclusion + a Dave review. This axis is really a <em>known-to-quality ratio</em>: gems are obscure by construction; the overrated are famous chains.</dd>
        <dt>NYC only (with the Bronx fix)</dt>
        <dd>Limited to the five boroughs. The original code matched "Bronx" but not "The Bronx," silently dropping 81 venues; folding them back promotes City Island Pizza Company to the top of the Hidden Gems list.</dd>
      </dl>
        <h2 style="margin-top:28px">Where the data comes from</h2>
        <dl>
          <dt>One&nbsp;Bite (Barstool) — the rating &amp; the reviews</dt>
          <dd>57,498 scored community reviews across ~3,000 NYC pizzerias, 2018–2026 — the current rating, and the review text the forward model reads.</dd>
          <dt>NYC DOHMH inspections — the reality axis</dt>
          <dd>Full restaurant-inspection history for ~1,900 pizza shops (scores, grades, violations).</dd>
          <dt>Editorial "best pizza" lists — the attention axis</dt>
          <dd>Infatuation, Time&nbsp;Out, Eater, Sietsema and others, dated via the Wayback Machine, for list inclusion over time.</dd>
          <dt>Yelp public snapshot</dt>
          <dd>Star rating and review count, shrunk by volume, blended into the Hidden Gems quality axis.</dd>
        </dl>

const CUISINES = [
  {key:"pizza", label:"Pizza", emoji:"🍕", live:true},
  {key:"mexican", label:"Mexican", emoji:"🌮", live:false, title:"Mexi-ball",
   body:"Same method, next cuisine. NYC dimension and inspection tables are already collected (1,412 taquerías + Tex-Mex); the perception axis — delivery platforms, editorial, birria hype — is next."},
  {key:"thai", label:"Thai", emoji:"🍜", live:false, title:"Thai-ball",
   body:"Moneyball for Thai food across the NY metro. Dimension and inspection tables collected; Thai SELECT certification and editorial lists build the perception axis next."},
];
const BOROUGHS = ["Manhattan","Brooklyn","Queens","Bronx","Staten Island"];
const QC = {underrated:{c:"#2e9e5b",bg:"rgba(46,158,91,.14)"},consensus:{c:"#2f6bd0",bg:"rgba(47,107,208,.12)"},
            overrated:{c:"#d1495b",bg:"rgba(209,73,91,.13)"},ignored:{c:"#9a8f83",bg:"rgba(154,143,131,.14)"}};
const GO="#2e9e5b", SKIP="#d1495b", NEU="#c4b8a8", YEL="#e0a82e", STAR="#2f6bd0";
const BOOST_HI=0.06;

const PAGES=[{key:"inspiration",label:"Inspiration"},{key:"methodology",label:"Methodology"}];
let state={cuisine:"pizza", page:"cuisine", flavor:"goskip", borough:"all"};
let chart=null, persistChart=null;

/* shell */
function go(page, cuisine){ state.page=page; if(cuisine) state.cuisine=cuisine; renderNav(); renderView(); }
function renderNav(){
  const nav=document.getElementById("tabs"); nav.innerHTML="";
  CUISINES.forEach(c=>{
    const b=document.createElement("button");
    b.className="tab"; b.setAttribute("aria-selected", state.page==="cuisine" && c.key===state.cuisine);
    b.innerHTML=`<span>${c.emoji}</span> ${c.label}`+(c.live?"":' <span class="soon">soon</span>');
    b.onclick=()=>go("cuisine", c.key);
    nav.appendChild(b);
  });
  const sp=document.createElement("span"); sp.className="navspacer"; nav.appendChild(sp);
  PAGES.forEach(p=>{
    const a=document.createElement("button");
    a.className="navlink"; a.setAttribute("aria-selected", state.page===p.key);
    a.textContent=p.label; a.onclick=()=>go(p.key); nav.appendChild(a);
  });
}
function renderView(){
  const app=document.getElementById("app"); app.innerHTML="";
  if(state.page==="inspiration" || state.page==="methodology"){
    app.appendChild(document.getElementById("view-"+state.page).content.cloneNode(true));
    window.scrollTo(0,0); return;
  }
  const c=CUISINES.find(x=>x.key===state.cuisine);
  if(c.live){ app.appendChild(document.getElementById("view-pizza").content.cloneNode(true)); initPizza(); }
  else{ app.appendChild(document.getElementById("view-soon").content.cloneNode(true));
    document.getElementById("soon-emoji").textContent=c.emoji;
    document.getElementById("soon-title").textContent=c.title;
    document.getElementById("soon-body").textContent=c.body; window.scrollTo(0,0); }
}

/* pizza */
function initPizza(){ buildChips(); renderFlavorNav(); renderFlavor(); drawPersist(); window.scrollTo(0,0); }

function buildChips(){
  const rb=DATA.filter(r=>r.rating_eligible && r.current_rating>=6);
  const picks=rb.filter(r=>worthOf(r)>=WORTH_CUT).length;
  const pass=rb.filter(r=>worthOf(r)<WORTH_CUT && r.current_rating>=7.5).length;
  document.getElementById("chips").innerHTML=`
    <div class="chip"><b>${SUMMARY.n_nyc_pizzerias}</b><span>NYC pizzerias</span></div>
    <div class="chip g"><b>${picks}</b><span>worth-it picks</span></div>
    <div class="chip s"><b>${pass}</b><span>looks good, pass</span></div>
    <div class="chip"><b>57,498</b><span>reviews analyzed</span></div>`;
}

const FLAVORS={
  goskip:{label:"Where to Go", sub:"the worth-it line"},
  gems:{label:"Hidden Gems", sub:"attention vs quality"},
};
function renderFlavorNav(){
  const nav=document.getElementById("flavornav"); nav.innerHTML="";
  Object.entries(FLAVORS).forEach(([k,f])=>{
    const b=document.createElement("button"); b.className="fbtn"; b.setAttribute("aria-selected",k===state.flavor);
    b.innerHTML=`${f.label} <small>${f.sub}</small>`;
    b.onclick=()=>{state.flavor=k; renderFlavorNav(); renderFlavor();};
    nav.appendChild(b);
  });
}
function boroSelect(){
  return `<label>Borough <select id="boroSel"><option value="all">All NYC</option>
    ${BOROUGHS.map(b=>`<option value="${b}">${b}</option>`).join("")}</select></label>`;
}
function wireBoro(){ const s=document.getElementById("boroSel"); if(!s)return; s.value=state.borough;
  s.onchange=e=>{state.borough=e.target.value; renderFlavor();}; }

function renderFlavor(){
  const m=document.getElementById("flavor-mount");
  if(state.flavor==="goskip") m.innerHTML=goskipMarkup(); else m.innerHTML=gemsMarkup();
  wireBoro();
  if(state.flavor==="goskip"){ drawGoSkip(); renderGoSkipBoards(); }
  else { drawGems(); renderGemsBoards(); }
}

/* ---------- FLAVOR: GO or SKIP ---------- */
function goskipMarkup(){
  return `
  <p class="eyebrow">Where to actually go</p>
  <h2>Rated well — and the reviews agree</h2>
  <p class="tagline">Current rating on the <b>x-axis</b> (6–10, the only ones worth considering); the de-trended <b>review signal</b> on the y. The dashed diagonal is the <b>worth-it bar</b> — the top quarter by <b>adjusted score = rating + 6.4 × signal</b>. Points clear it (<b style="color:${GO}">green</b>), fall short despite a positive forward signal (<b style="color:${YEL}">yellow</b>), or carry a negative one (<b style="color:${SKIP}">red</b>); the five <b style="color:${STAR}">blue stars</b> are the best bets overall. The 6.4 weight is deliberate: one standard deviation of review signal counts the same as one of rating, so a strong review can lift a 6.6 onto the list and a bad one can drop an 8.</p>
  <div class="controls">${boroSelect()}</div>
  <div class="grid2">
    <div class="panel">
      <div class="chartbox"><canvas id="chart"></canvas></div>
      <div class="legend">
        <span style="color:${STAR};font-weight:700">★ Top 5 best bets</span>
        <span><i style="background:${GO}"></i>Worth it (above the bar)</span>
        <span><i style="background:${YEL}"></i>Positive forward signal, under the bar</span>
        <span><i style="background:${SKIP}"></i>Negative forward signal</span>
        <span>– – –&nbsp; worth-it bar (top quarter)</span>
      </div>
    </div>
    <div>
      <ul class="readbox">
        <li><b style="color:${STAR}">Blue stars</b> are the five best bets overall — the go-to list.</li>
        <li><b style="color:${GO}">Green</b> clears the worth-it bar. <b style="color:${YEL}">Yellow</b>'s reviews carry a positive <em>forward</em> signal — they predict a rising score — but its rating's too modest to clear the bar (the sleepers). <b style="color:${SKIP}">Red</b>'s reviews point the other way.</li>
        <li><b style="color:${SKIP}">Lower-right</b> = the traps: rated 8–9 but the reviews (grease, price, a fading spike) sink it under the bar.</li>
      </ul>
      <div class="callout"><h3>The Jason Giambis</h3>
        <p class="small" style="color:var(--ink2);margin:0">Ceres, L'Industrie and the other line-out-the-door darlings are consensus winners — elite by reputation <em>and</em> by the numbers, the way <b>Jason Giambi</b> was the 2000 AL MVP with an OPS over 1.000. Nobody needed a model. This is for the hundreds of shops where the rating might be lying to you.</p></div>
    </div>
  </div>
  <div class="boards three">
    <div class="board panel"><h3><span style="color:${QC.consensus.c}">★</span> Best bets</h3>
      <div class="sub">Top adjusted score (rating + 6.4×signal)</div>
      <table><thead><tr><th>#</th><th>Shop</th><th class="num">Rate</th><th class="num">Adj</th></tr></thead>
      <tbody id="best-body"></tbody></table></div>
    <div class="board panel"><h3><span style="color:${QC.underrated.c}">▲</span> Most underrated</h3>
      <div class="sub">Reviews vouch most, beyond the number</div>
      <table><thead><tr><th>#</th><th>Shop</th><th class="num">Rate</th><th class="num">Signal</th></tr></thead>
      <tbody id="under-body"></tbody></table></div>
    <div class="board panel"><h3><span style="color:${QC.overrated.c}">▼</span> Looks good, but pass</h3>
      <div class="sub">Rated 7.5+ but reviews sink it under the bar</div>
      <table><thead><tr><th>#</th><th>Shop</th><th class="num">Rate</th><th class="num">Adj</th></tr></thead>
      <tbody id="pass-body"></tbody></table></div>
  </div>`;
}
const WORTH_W=6.4;           // signal weight: equal standardized weight (1 SD signal = 1 SD rating)
const REC_FRAC=0.25;         // recommend the top quarter by adjusted score
const XSPLIT=8;              // crosshair vertical reference
function worthOf(r){ return r.current_rating + WORTH_W*r.nudge; }
function allEligible(){ return DATA.filter(r=>r.rating_eligible && r.current_rating>=6); }
function worthCut(){           // adjusted-score cutoff for the top REC_FRAC (computed over all NYC, stable under borough filter)
  const a=allEligible().map(worthOf).sort((x,y)=>y-x);
  return a.length? a[Math.min(a.length-1, Math.floor(a.length*REC_FRAC))] : 8;
}
const WORTH_CUT = worthCut();
function goskipRows(){
  return DATA.filter(r=>r.rating_eligible && r.current_rating>=6 && (state.borough==="all"||r.borough===state.borough));
}
function reasonFor(r){
  if(r.nudge<=-0.05){
    if(r.grease_rate>=0.34) return "grease showing";
    if(r.score_delta>=0.8) return "recent spike — fading";
    if(r.nudge<=-0.2) return "price / soft reviews";
    return "reviews run cool";
  }
  if(r.nudge>=0.05){
    if(r.specificity>=4.1) return "specific, detailed praise";
    if(r.score_delta<=-0.6) return "quietly climbing";
    return "reviews vouch for it";
  }
  return "reviews neutral";
}
const worthLine={id:"worthLine",beforeDatasetsDraw(c){const{ctx,chartArea:a,scales:s}=c;if(!a)return;
  ctx.save();
  const FONT=getComputedStyle(document.body).fontFamily;
  // zero-signal reference line
  const py0=s.y.getPixelForValue(0);
  ctx.strokeStyle="rgba(80,60,45,.22)";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(a.left,py0);ctx.lineTo(a.right,py0);ctx.stroke();
  // dashed worth-it bar: adjusted = rating + W*signal = CUT  ->  signal=(CUT-rating)/W
  const yAt=x=>(WORTH_CUT-x)/WORTH_W;
  const pL=s.y.getPixelForValue(yAt(s.x.min)), pR=s.y.getPixelForValue(yAt(s.x.max));
  ctx.strokeStyle="rgba(46,158,91,.9)";ctx.lineWidth=1.7;ctx.setLineDash([7,4]);
  ctx.beginPath();ctx.moveTo(a.left,pL);ctx.lineTo(a.right,pR);ctx.stroke();ctx.setLineDash([]);
  ctx.font="700 12px "+FONT;
  ctx.fillStyle="rgba(46,158,91,.9)";ctx.textAlign="right";ctx.fillText("WORTH IT ▲",a.right-10,a.top+18);
  ctx.restore();}};
function drawGoSkip(){
  const rows=goskipRows(), ctx=document.getElementById("chart"); if(!ctx)return;
  const top5=new Set(rows.slice().sort((a,b)=>worthOf(b)-worthOf(a)).slice(0,5).map(r=>r.name));
  const pts=rows.map(r=>({x:r.current_rating,y:r.nudge,d:r,top:top5.has(r.name)}));
  const ns=rows.map(r=>r.nudge);
  const dLo=(WORTH_CUT-10)/WORTH_W, dHi=(WORTH_CUT-6)/WORTH_W;   // worth-it line endpoints at x=10 / x=6
  const ymax=Math.max(Math.max(...ns), dHi)+0.05, ymin=Math.min(Math.min(...ns), dLo)-0.05;
  const col=r=> worthOf(r)>=WORTH_CUT?GO : (r.nudge>=0?YEL:SKIP);   // green above bar, yellow vouched-under, red warn
  if(chart)chart.destroy();
  chart=new Chart(ctx,{type:"scatter",
    data:{datasets:[{data:pts,parsing:false,
      backgroundColor:pts.map(p=>p.top?STAR:col(p.d)+"cc"),
      borderColor:pts.map(p=>p.top?"#1b4a94":"#fff"),borderWidth:pts.map(p=>p.top?1:.5),
      pointStyle:pts.map(p=>p.top?"star":"circle"),
      pointRadius:pts.map(p=>p.top?11:5),pointHoverRadius:pts.map(p=>p.top?13:8)}]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:6},
      scales:{x:{min:6,max:10,title:{display:true,text:"Current rating  (One Bite community)  ▶ more loved",font:{size:12,weight:"600"}},grid:{color:"#f0e7d8"}},
              y:{min:ymin,max:ymax,title:{display:true,text:"◀ predicts a dip      FORWARD SIGNAL (what reviews predict)      predicts a lift ▶",font:{size:11,weight:"600"}},grid:{color:"#f0e7d8"}}},
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>{const d=c.raw.d;const s=d.nudge>=0?"+":"";const w=worthOf(d);
          return [`${c.raw.top?"★ ":""}${d.name} — ${d.borough}`,
                  `Rated ${d.current_rating.toFixed(1)} · signal ${s}${d.nudge.toFixed(2)} · adj ${w.toFixed(1)} ${w>=WORTH_CUT?"— worth it":""}`,
                  `${reasonFor(d)} · ${d.n_rev} reviews`];}}}}},
    plugins:[worthLine]});
}
function gsRow(r,i,metric){
  const m = metric==="signal"
    ? {cls:r.nudge>=0?"pos":"neg", txt:(r.nudge>=0?"+":"")+r.nudge.toFixed(2)}
    : {cls:"", txt:worthOf(r).toFixed(1)};
  return `<tr><td class="rank">${i+1}</td>
    <td class="shop"><b>${r.name}</b><small>${r.borough} · <span class="reason">${reasonFor(r)}</span></small></td>
    <td class="num">${r.current_rating.toFixed(1)}</td>
    <td class="num metric ${m.cls}" style="font-weight:700">${m.txt}</td></tr>`;
}
function renderGoSkipBoards(){
  const r=goskipRows();
  const best=r.slice().sort((a,b)=>worthOf(b)-worthOf(a)).slice(0,12);
  const under=r.slice().sort((a,b)=>b.nudge-a.nudge).slice(0,12);
  const pass=r.filter(x=>x.current_rating>=7.5 && worthOf(x)<WORTH_CUT).sort((a,b)=>worthOf(a)-worthOf(b)).slice(0,12);
  document.getElementById("best-body").innerHTML=best.map((x,i)=>gsRow(x,i,"adj")).join("")||empty();
  document.getElementById("under-body").innerHTML=under.map((x,i)=>gsRow(x,i,"signal")).join("")||empty();
  document.getElementById("pass-body").innerHTML=pass.map((x,i)=>gsRow(x,i,"adj")).join("")||empty();
}

const quadBG={id:"quadBG",beforeDatasetsDraw(c){const{ctx,chartArea:a,scales}=c;if(!a)return;
  const mx=scales.x.getPixelForValue(0.5),my=scales.y.getPixelForValue(0.5);ctx.save();

  ctx.fillStyle=QC.ignored.bg;ctx.fillRect(a.left,my,mx-a.left,a.bottom-my);

  ctx.fillStyle="rgba(209,73,91,.85)";ctx.textAlign="right";ctx.fillText("OVERRATED",a.right-8,a.bottom-10);ctx.restore();}};
function drawGems(){

}
function dedupe(list){const seen=new Set(),out=[];for(const r of list){if(seen.has(r.name))continue;seen.add(r.name);out.push(r);}return out;}
function gemRow(r,i){const q=r.quadrant;
  return `<tr><td class="rank">${i+1}</td>
    <td class="shop"><b>${r.name}</b><small>${r.borough} ${r.zip} · <span class="pill ${q==="underrated"?"under":q}">${q}</span></small></td>
    <td class="num">${Math.round(r.quality*100)}</td><td class="num">${Math.round(r.attention*100)}</td>
    <td class="num metric ${r.gap>=0?"pos":"neg"}">${r.gap>0?"+":""}${Math.round(r.gap*100)}</td></tr>`;}
function renderGemsBoards(){
  const r=gemsRows();
  const under=dedupe(r.filter(x=>x.gap>0).sort((a,b)=>b.gap-a.gap)).slice(0,12);
  const over=dedupe(r.filter(x=>x.gap<0).sort((a,b)=>a.gap-b.gap)).slice(0,12);
  document.getElementById("gem-under").innerHTML=under.map(gemRow).join("")||empty();
  document.getElementById("gem-over").innerHTML=over.map(gemRow).join("")||empty();
}
function empty(){return `<tr><td colspan="5" class="small" style="padding:16px 8px">No shops match this filter.</td></tr>`;}
